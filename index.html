<!DOCTYPE html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Fax Food 管理後台</title><style>
*{box-sizing:border-box;margin:0}:root{--r:#e63946;--k:#14181f;--m:#6b7280;--b:#f3f5f7;--l:#e2e6ea}

</style></head><body>
<div id=eb hidden></div>
<div id=lg><form onsubmit="return go(event)"><div class=mk>FFF</div><h1>管理後台</h1><p>請選擇身份登入</p>

const db=initializeFirestore(initializeApp({apiKey:"AIzaSyDE5ph-uHazh6m0Q4ENeGirLHEI59Cpfhw",authDomain:"uspp1-cd038.firebaseapp.com",projectId:"uspp1-cd038",storageBucket:"uspp1-cd038.firebasestorage.app",messagingSenderId:"118206137592",appId:"1:118206137592:web:00879c764b12eb2e25270d"}),{experimentalAutoDetectLongPolling:true});
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),F=10,P={},

rnd=()=>Math.random().toString(36).slice(2,8),hue=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360,

anim=()=>{document.querySelectorAll("[data-n]").forEach(e=>{const k=e.dataset.k,n=+e.dataset.n,f0=P[k]??0,t0=performance.now();P[k]=n;const f=t=>{const x=Math.min(1,(t-t0)/800);e.textContent=Math.round(f0+(n-f0)*x);x<1&&requestAnimationFrame(f)};requestAnimationFrame(f)});
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(e=>{P[e.dataset.k]=+e.dataset.w;e.style.width=e.dataset.w+"%"})))},

d.querySelector("[data-x]").onclick=()=>d.remove();d.querySelector("[data-o]").onclick=async()=>{const v={};d.querySelectorAll("input").forEach(i=>v[i.name]=i.value.trim());if(await cb(v)!==false)d.remove()}},

er=e=>{console.error(e);const h={"permission-denied":"Firestore 規則拒絕存取,請到 Firebase 控制台 > Firestore > 規則 修改","unavailable":"網絡連不上 Firebase,請檢查網絡或 VPN","failed-precondition":"尚未建立 Firestore 資料庫,請先在控制台建立","not-found":"尚未建立 Firestore 資料庫,請先在控制台建立"}[e.code]||e.message;$("eb").textContent="無法連接 Firebase:"+h;$("eb").hidden=false};
let U=null,M=[],R=[],O=[],tab="s",seen=null,role=0;const L={},fresh=new Set(),ready=()=>L.merchants&&L.riders&&L.orders;
try{U=JSON.parse(sessionStorage.ffa||"null")}catch{}
const sub=(n,f)=>onSnapshot(collection(db,n),s=>{$("eb").hidden=true;f(s.docs.map(d=>({id:d.id,...d.data()})));L[n]=1;U&&draw()},er);
sub("merchants",x=>M=x);sub("riders",x=>R=x);

if(U.rid&&O.some(o=>o.status=="ready"&&!o.rid&&seen.get(o.id)!="ready")){toast("有新訂單可接");beep()}}

else{const r=R.find(x=>x.user==u&&x.pass==p);if(r)U={rid:r.id}}

window.rm=id=>confirm("確定移除這間商戶?")&&deleteDoc(doc(db,"merchants",id));

window.ar=()=>ask("新增騎手",[["n","騎手姓名"]],async v=>{if(!v.n){toast("請輸入姓名");return false}const u="R"+Math.floor(1000+Math.random()*9000),p=rnd();await addDoc(collection(db,"riders"),{name:v.n,user:u,pass:p});cred("騎手帳號已建立",u,p)});
window.am=()=>ask("新增餐點",[["n","餐點名稱"],["p","價錢 (HKD)","type=number min=1 step=1"]],async v=>{const p=+v.p;if(!v.n||!(p>0)){toast("請輸入名稱及大於 0 的價錢");return false}await updateDoc(doc(db,"merchants",U.mid),{menu:arrayUnion({n:v.n,p})});toast("已新增")});

window.take=async id=>{try{await runTransaction(db,async t=>{const r=doc(db,"orders",id),d=(await t.get(r)).data();if(d.status!="ready"||d.rid)throw 0;t.update(r,{status:"delivering",rid:U.rid,rn:R.find(x=>x.id==U.rid).name})});toast("接單成功")}catch{toast("此訂單已被其他騎手接走")}};

const oc=(o,b,i)=>`<div class="c ${fresh.delete(o.id)?"nw":""}" style="animation-delay:${Math.min(i,8)*.04}s"><b>${esc(o.mn)}</b><span class=t style="background:${C[o.status]}">${SL[o.status]||o.status}</span><span style="float:right;font-weight:800">$${o.total}</span><br><small>#${o.id.slice(0,5).toUpperCase()} · ${o.items.map(x=>esc(x.n)+" × "+x.q).join("、")}<br>${esc(o.cn)} · ${esc(o.ph)} · ${esc(o.ad)}${o.rn?" · 騎手 "+esc(o.rn):""}</small>${b?`<div style="margin-top:8px">${b}</div>`:""}</div>`,
